[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-ws"
version = "0.1.0"
description = "An independent web console for running OSE applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ose==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<18"]

[project.optional-dependencies]
recording = ["ose[recording]==0.1.0"]
test = ["httpx>=0.28,<1", "build>=1,<2"]

[project.scripts]
ose-ws = "ose_ws.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ose_ws = ["static/*", "static/assets/*"]
