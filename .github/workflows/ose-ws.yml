name: OSE Web Console
on:
  push:
    paths: ['tools/python*', 'tools/find-python.sh', 'ose-ws/**', 'ose/**', 'sdl/runtime/python/**', '.github/workflows/ose-ws.yml']
  pull_request:
    paths: ['tools/python*', 'tools/find-python.sh', 'ose-ws/**', 'ose/**', 'sdl/runtime/python/**', '.github/workflows/ose-ws.yml']
jobs:
  console:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ose-ws/frontend/package-lock.json
      - run: python -m pip install ./ose './ose-ws[test,recording]'
      - name: Build and test the frontend
        working-directory: ose-ws/frontend
        run: npm ci && npm run build && npm test
      - name: Test against real OSE services
        run: make -C ose-ws test-python
      - name: Verify shared OSE diagnostics and selection
        run: |
          PYTHONPATH=ose/src python -m unittest discover -s ose/tests/unit -p 'test_top.py' -v
          PYTHONPATH=ose/src:sdl/runtime/python python -m unittest discover -s ose/tests/unit -p 'test_recording_console.py' -v
      - name: Build distributions and verify embedded assets
        working-directory: ose-ws
        run: |
          python -m build
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'ose_ws/static/index.html' in z.namelist(); assert any(p.endswith('.js') for p in z.namelist())"
          python tests/check_wheel.py dist/ose_ws-0.1.0-py3-none-any.whl
      - name: Launch the installed wheel outside the checkout
        run: python ose-ws/tests/installed_smoke.py
