name: OSE language SDKs
on:
  push:
    paths: ['tools/python*', 'tools/find-python.sh', 'tools/sdl-services.mk', 'ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
  pull_request:
    paths: ['tools/python*', 'tools/find-python.sh', 'tools/sdl-services.mk', 'ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
jobs:
  full:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ada toolchain
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Install package
        run: python -m pip install ./ose
      - name: Build required SDL services
        run: make -C sdl services
      - name: Verify all languages and execution modes
        timeout-minutes: 10
        run: make -C ose test
      - name: Verify interactive recording
        run: make -C ose test-recording
      - name: Installed SDK smoke test
        run: python ose/tests/installed_sdk.py
  java7:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # Java 7 is no longer available through Zulu's version discovery API.
      - name: Download archived Zulu JDK 7
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zulu-jdk7.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://cdn.azul.com/zulu/bin/zulu7.56.0.11-ca-jdk7.0.352-linux_x64.tar.gz
          # SHA-256 from the Azul Java SE 7 compatibility certificate.
          printf '%s  %s\n' '8a7387c1ed151474301b6553c6046f865dc6c1e1890bcf106acc2780c55727c8' "$archive" | sha256sum --check
      - uses: actions/setup-java@v6
        with:
          distribution: jdkfile
          java-version: '7.0.352'
          jdk-file: ${{ runner.temp }}/zulu-jdk7.tar.gz
      - name: Build required SDL services
        run: make -C sdl services
      - name: Verify actual Java 7 compilation and execution
        run: make -C ose test-java
      - name: Verify CH2 input callbacks on Java 7
        run: make -C ose test-java-inputs-v2
      - name: Verify shared parameters on Java 7
        run: PYTHONPATH="$PWD/ose/src:$PWD/ose" TEST_LANGUAGES=java python -m unittest discover -s ose/tests/integration -p 'test_parameters.py' -k java -v
