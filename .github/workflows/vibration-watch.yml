name: Vibration Watch
on:
  push:
    paths: ['tools/python*', 'tools/find-python.sh', 'vibration-watch/**', 'sdl/**', 'ose/**', 'ose-ws/**', 'setenv.sh', '.github/workflows/vibration-watch.yml']
  pull_request:
    paths: ['tools/python*', 'tools/find-python.sh', 'vibration-watch/**', 'sdl/**', 'ose/**', 'ose-ws/**', 'setenv.sh', '.github/workflows/vibration-watch.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: vibration-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install parameter synchronization dependencies
        run: python -m pip install '../ose[sync]'
      - name: Select Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal && rustup default 1.85.1
      - name: Validate application
        run: make validate
      - name: Test business logic, simulation and distributed processes
        run: make test
