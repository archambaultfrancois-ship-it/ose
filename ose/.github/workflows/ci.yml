name: OSE
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Read SDL revision
        id: sdl
        run: python -c 'import json,os; d=json.load(open("sdl-dependency.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+d["revision"]+"\nsubdirectory="+d["subdirectory"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: archambaultfrancois-ship-it/ose
          ref: ${{ steps.sdl.outputs.revision }}
          path: build/sdl-dependency
          token: ${{ secrets.SDL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ada toolchain
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Install project
        run: python -m pip install .
      - name: Select SDL project
        run: echo "SDL_ROOT=$PWD/build/sdl-dependency/${{ steps.sdl.outputs.subdirectory }}" >> "$GITHUB_ENV"
      - name: Prepare recording dependencies for replay tests
        run: make -C "$SDL_ROOT" recording-deps
      - name: Test
        run: make test
      - name: Prepare optional filtering service
        run: make -C "$SDL_ROOT" filter-python
      - name: Verify interactive recording
        run: make test-recording
      - name: Installed SDK smoke test
        run: python tests/installed_sdk.py

  java7:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Java 7 is no longer available through Zulu's version discovery API.
      - name: Download archived Zulu JDK 7
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zulu-jdk7.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://cdn.azul.com/zulu/bin/zulu7.56.0.11-ca-jdk7.0.352-linux_x64.tar.gz
          # SHA-256 from the Azul Java SE 7 compatibility certificate.
          printf '%s  %s\n' '8a7387c1ed151474301b6553c6046f865dc6c1e1890bcf106acc2780c55727c8' "$archive" | sha256sum --check
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          java-version: '7.0.352'
          jdkFile: ${{ runner.temp }}/zulu-jdk7.tar.gz
      - name: Read SDL revision
        id: sdl
        run: python -c 'import json,os; d=json.load(open("sdl-dependency.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+d["revision"]+"\nsubdirectory="+d["subdirectory"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: archambaultfrancois-ship-it/ose
          ref: ${{ steps.sdl.outputs.revision }}
          path: build/sdl-dependency
          token: ${{ secrets.SDL_ACCESS_TOKEN || github.token }}
      - name: Select SDL project
        run: echo "SDL_ROOT=$PWD/build/sdl-dependency/${{ steps.sdl.outputs.subdirectory }}" >> "$GITHUB_ENV"
      - name: Prepare recording dependencies for replay tests
        run: make -C "$SDL_ROOT" recording-deps
      - run: make test-java
      - name: Verify CH2 input callbacks on Java 7
        run: make test-java-inputs-v2
      - name: Verify shared parameters on Java 7
        run: PYTHONPATH="$PWD/src" TEST_LANGUAGES=java python -m unittest discover -s tests/integration -p 'test_parameters.py' -k java -v
