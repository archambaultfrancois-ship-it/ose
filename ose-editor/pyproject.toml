[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-editor"
version = "0.1.0"
description = "Source-preserving graphical OSE and SDL model editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ose==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "build>=1,<2"]

[project.scripts]
ose-editor = "ose_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ose_editor = ["static/*", "static/assets/*", "coverage.json"]
